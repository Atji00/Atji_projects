[project]
name = "credit-scoring-modelling"
version = "1.0.0"
description = "Build a Machine Learning project end-to-end"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "plotly>=5.22.0",
    "cufflinks>=0.17.3",
    "streamlit>=1.41.1",
    "chart-studio>=1.1.0",
    "unidecode>=1.3.8",
    "scikit-learn>=1.6.0",
    "statsmodels>=0.14.5",
    "xgboost>=3.0.5",
    "mlflow>=3.4.0",
    "imbalanced-learn>=0.14.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "pytest>=9.1.1",
    "polars>=1.43.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

addopts = "-v --html=tests/reports/pytest-report.html --self-contained-html"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "pytest-html>=4.2.0",
]
