
# ----------------------------------------------------------
# Logistic Regression Classifier
# ----------------------------------------------------------

logistic_regression:

  enabled: true

  parameters:
    max_iter: 100
    solver: 'lbfgs'
    class_weight: 'balanced'


# ----------------------------------------------------------
# Random Forest Classifier
# ----------------------------------------------------------

random_forest:

  enabled: true

  parameters:
    criterion: 'gini'
    n_estimators: 300
    max_depth: null
    class_weight: 'balanced'
    min_samples_split: 2
    min_samples_leaf: 1
    n_jobs: -1


# ----------------------------------------------------------
# XGBoost Classifier
# ----------------------------------------------------------

xgboost:

  enabled: true

  parameters:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0
    reg_alpha: 0
    reg_lambda: 1
    n_jobs: -1
